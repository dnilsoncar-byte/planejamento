<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejamento Financeiro Empresarial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script>
/* ===== CONFIGURAÇÃO =====
   Cole aqui a URL e a chave "anon public" do Supabase (Project Settings > Data API / API Keys).
   Com as chaves preenchidas, os dados ficam no Supabase e o acesso usa os usuários do Supabase.
   Se ficar vazio, o programa funciona só neste navegador, com login e senha por empresa. */
window.PLANEJAMENTO_CONFIG = {
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: ""
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: menu lateral fixo + área de trabalho com cabeçalho; tema claro; vira menu superior rolável no celular */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F1F4F8; --surface-3:#E9EEF4; --fg:#18233A; --fg-2:#3B4760; --muted:#6B7891; --line:#E2E7EF; --line-2:#D3DAE5;
  --accent:#1B7F95; --accent-2:#156A7D; --accent-soft:#E2F2F5; --accent-ink:#FFFFFF;
  --s-in:#4A86C8; --s-out:#E8833A; --s-bal:#2B3A55; --s-alt:#8C6BC8;
  --good:#1D8049; --bad:#CC3A2F; --warn:#B26B00; --good-bg:#E8F5EE; --bad-bg:#FCEDEB; --warn-bg:#FFF4E0;
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif; --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(24,35,58,.05),0 4px 16px rgba(24,35,58,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;font-weight:800;letter-spacing:-.01em}
h1{font-size:1.45rem} h2{font-size:1.2rem} h3{font-size:1rem;font-weight:700} h4{font-size:.9rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* ---------- estrutura ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font:800 .95rem/1.15 var(--f-display);padding:2px 6px}
.brand small{display:block;font:500 .72rem var(--f-body);color:var(--muted)}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.empcard{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 .82rem var(--f-display);flex:none;letter-spacing:.02em}
.avatar.lg{width:48px;height:48px;border-radius:12px;font-size:1rem}
.empcard b{display:block;font-size:.86rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empcard small{color:var(--muted);font-size:.74rem}
.nav{display:grid;gap:2px}
.nav-sec{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;padding:8px 10px;color:var(--fg-2);font-weight:500;cursor:pointer;text-align:left}
.nav button svg{flex:none;opacity:.75}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav button[aria-current="page"] svg{opacity:1}
.side-foot{margin-top:auto;display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px;font-size:.8rem;color:var(--muted)}
.side-foot .row{gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:6;background:rgba(244,246,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.topbar .titles{flex:1;min-width:220px}
.topbar .titles p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.tb-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.content{padding:22px 28px 60px;display:grid;gap:18px;max-width:1400px;width:100%}
.save{font-size:.78rem;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding-bottom:8px}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.save.pending .dot{background:var(--warn)} .save.err{color:var(--bad)} .save.err .dot{background:var(--bad)}

/* ---------- componentes ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));align-items:start}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow);display:grid;gap:2px;position:relative}
.kpi .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.kpi .val{font:800 1.42rem/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kpi .sub{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .spark{position:absolute;right:12px;bottom:12px;width:84px;height:26px;opacity:.9}
.kpi.has-spark .sub{padding-right:90px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-h p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.muted{color:var(--muted)} .pos{color:var(--good)} .neg{color:var(--bad)} .warnc{color:var(--warn)}
.note{font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.info{background:var(--accent-soft);color:var(--accent-2)} .chip.plain{background:var(--surface-2);color:var(--muted)}
.delta{font-size:.74rem;font-weight:700}
ul.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.86rem}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:700;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right}
th.sticky,td.sticky{position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:1px 0 0 var(--line)}
th.sticky{background:var(--surface-2);z-index:3}
tr.grp td{background:#F7F9FC;font-weight:700;color:var(--fg-2)} tr.grp td.sticky{background:#F7F9FC}
tr.sub td{font-weight:700;background:var(--accent-soft);color:var(--accent-2)} tr.sub td.sticky{background:var(--accent-soft)}
tr.tot td{font-weight:800;border-top:2px solid var(--line-2)}
tr.tot td.sticky{background:var(--surface)}
tbody tr:hover td{background:#FAFBFD} tbody tr.sub:hover td{background:var(--accent-soft)} tbody tr.grp:hover td{background:#F7F9FC}
td.cell{padding:2px 3px}
td input,td select{width:100%;min-width:84px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px}
td input:hover,td select:hover{border-color:var(--line-2)}
td input:focus,td select:focus{border-color:var(--accent);background:#fff;outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
td input[type=number],td input.money{text-align:right}
td input::placeholder{color:#C3CAD6}
td input.name{min-width:220px;font-weight:500}
.real-set{background:#F3FAF6!important}
.var-bad{color:var(--bad);font-weight:600} .var-good{color:var(--good);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:.84rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.primary:hover{background:var(--accent-2);color:#fff}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:3px 9px;font-size:.78rem}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:6px;font-size:.9rem;line-height:1}
.icon-btn:hover{color:var(--bad);background:var(--bad-bg)}
.icon-btn.edit:hover{color:var(--accent-2);background:var(--accent-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row.c{align-items:center}
.field{display:grid;gap:4px;min-width:0}
.field label,.flabel{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea,.tb-ctrl select,.tb-ctrl input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.field input:focus,.field select:focus,.tb-ctrl select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.span2{grid-column:span 2} .span-all{grid-column:1/-1}
@media (max-width:520px){.span2{grid-column:auto}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.86rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.fillbar{background:var(--accent-soft);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:12.5px var(--f-body)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:#9AA6B8;stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.legend span.line::before{height:3px;border-radius:2px;vertical-align:3px}
.tdot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}
#tip{position:fixed;pointer-events:none;z-index:50;background:#18233A;color:#fff;font-size:.78rem;padding:7px 10px;border-radius:7px;max-width:280px;box-shadow:0 6px 20px rgba(24,35,58,.2);line-height:1.45}
.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:rgba(27,127,149,.05)}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:.82rem}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.hb-t{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.hb-t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.hb-t b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.hb-v{text-align:right;font-weight:600;white-space:nowrap}
.hb-v small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.gauge{width:100%;max-width:240px;display:block;margin:0 auto}
.gauge-n{font:800 34px var(--f-display);fill:var(--fg)} .gauge-l{font:500 11px var(--f-body);fill:var(--muted)}
.score-list{display:grid;gap:7px;margin-top:10px}
.score-item{display:grid;grid-template-columns:1fr 70px 46px;gap:8px;align-items:center;font-size:.8rem}
.mini{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}.mini i{display:block;height:100%;border-radius:3px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);background:var(--surface)}
.list{display:grid;gap:8px}
.item{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.item.on{border-color:var(--accent);background:var(--accent-soft)}
.heat td.n{font-weight:600}
.dre-k{font-weight:700}

/* ---------- acesso ---------- */
.access{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.access-hero{background:linear-gradient(160deg,#16596A,#1B7F95 55%,#3E9FB2);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.access-hero h1{font-size:2.1rem;line-height:1.12;max-width:16ch}
.access-hero p{max-width:46ch;opacity:.9;font-size:1rem}
.access-hero ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-size:.92rem}
.access-hero li{display:flex;gap:10px;align-items:center;opacity:.95}
.access-hero li::before{content:"";width:6px;height:6px;border-radius:50%;background:#BFE8EF}
.access-main{padding:48px 40px;display:flex;flex-direction:column;gap:18px;justify-content:center;max-width:620px;width:100%;margin:0 auto}
.cards{display:grid;gap:10px}
.ecard{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s}
.ecard:hover{border-color:var(--accent)}
.ecard-h{display:flex;gap:12px;align-items:center;padding:14px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.ecard-h b{display:block;font:700 .98rem var(--f-display)}
.ecard-h small{color:var(--muted);font-size:.78rem}
.ecard-body{padding:0 14px 14px;display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.err{color:var(--bad);font-size:.82rem;min-height:1.1em}
.linkbtn{border:0;background:none;color:var(--accent-2);font-weight:600;cursor:pointer;padding:0}

@media (max-width:1100px){.g-21{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:8;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .side .brand small,.empcard,.nav-sec{display:none}
  .nav{display:flex;overflow-x:auto;gap:2px;width:100%;order:3}
  .nav button{white-space:nowrap;width:auto}
  .side-foot{margin:0 0 0 auto;border:0;padding:0;display:flex}
  .side-foot .who{display:none}
  .topbar{position:static;padding:14px 16px}
  .content{padding:16px 16px 50px}
  .access{grid-template-columns:1fr}.access-hero{padding:28px 20px}.access-hero ul{display:none}.access-main{padding:24px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" hidden></div>
<script>
/* ============================ utilidades ============================ */
const CFG=window.PLANEJAMENTO_CONFIG||{};
const ONLINE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&typeof window!=="undefined"&&window.supabase);
const sb=ONLINE?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const LS_KEY="planejamento-financeiro-v2", LS_REC="planejamento-financeiro-recentes";
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const brl2=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const nf1=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1});
const pct=(v,d=1)=>(v!=null&&isFinite(v)?(v*100).toLocaleString("pt-BR",{maximumFractionDigits:d}):"–")+"%";
const R=v=>brl.format(Math.round(v||0));
const R2=v=>brl2.format(v||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(globalThis.crypto?.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g,()=>(Math.random()*16|0).toString(16)));
const num=v=>{if(typeof v==="number")return isFinite(v)?v:0;let s=String(v??"").trim().replace(/[R$\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:0;};
const sum=a=>a.reduce((t,v)=>t+(v||0),0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hoje=new Date();
const ymHoje=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`;
const hojeISO=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
function addMes(ym,k){let[y,m]=ym.split("-").map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return`${y}-${String(m).padStart(2,"0")}`;}
function difMes(a,b){const[y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return(y2-y1)*12+(m2-m1);}
function addDias(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function addMesData(iso,k){const[y,m,d]=iso.split("-").map(Number);const ym=addMes(`${y}-${String(m).padStart(2,"0")}`,k);const[yy,mm]=ym.split("-").map(Number);const ult=new Date(yy,mm,0).getDate();return`${ym}-${String(Math.min(d,ult)).padStart(2,"0")}`;}
const difDias=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const rotMes=ym=>{const[y,m]=ym.split("-");return`${MESES[+m-1]}/${y.slice(2)}`;};
const dataBR=iso=>iso?iso.slice(0,10).split("-").reverse().join("/"):"";
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
async function sha256(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return"x"+(h>>>0).toString(16);}}
const iniciais=n=>String(n||"?").replace(/\b(ltda|me|eireli|s\.?a\.?|epp)\b\.?/gi,"").trim().split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase()||"?";

/* ============================ modelo do planejamento ============================ */
const H=12; // horizonte em meses
// Estrutura da DRE gerencial. tipo: receita | variavel (acompanha a receita) | fixa | financeira | investimento | financiamento
const GRUPOS=[
  {k:"receita",     nome:"Receita bruta",                         sinal:+1, tipo:"receita"},
  {k:"deducao",     nome:"Deduções e impostos sobre vendas",      sinal:-1, tipo:"variavel"},
  {k:"custo",       nome:"Custos variáveis (CMV, comissões, taxas)", sinal:-1, tipo:"variavel"},
  {k:"pessoal",     nome:"Despesas com pessoal",                  sinal:-1, tipo:"fixa"},
  {k:"operacional", nome:"Despesas administrativas e de ocupação", sinal:-1, tipo:"fixa"},
  {k:"comercial",   nome:"Despesas comerciais e marketing",       sinal:-1, tipo:"fixa"},
  {k:"fin_rec",     nome:"Receitas financeiras",                  sinal:+1, tipo:"financeira"},
  {k:"fin_desp",    nome:"Despesas financeiras (tarifas, outras)",sinal:-1, tipo:"financeira"},
  {k:"tributos",    nome:"IRPJ e CSLL",                           sinal:-1, tipo:"variavel"},
  {k:"investimento",nome:"Investimentos (CAPEX)",                 sinal:-1, tipo:"investimento"},
  {k:"aporte",      nome:"Aportes de sócios",                     sinal:+1, tipo:"financiamento"},
  {k:"retirada",    nome:"Distribuição de lucros e retiradas",    sinal:-1, tipo:"financiamento"}
];
const G=Object.fromEntries(GRUPOS.map(g=>[g.k,g]));
const PRAZOS=[[0,"À vista"],[30,"30 dias"],[60,"60 dias"],[90,"90 dias"]];
const REGIMES=["","MEI","Simples Nacional","Lucro Presumido","Lucro Real","Outro"];
const zeros=()=>Array(H).fill(0);

function vazio(inicio=ymHoje){return{versao:3,inicio,mesRef:inicio,saldoInicial:0,saldoMinimo:0,incluirMetas:true,sazonal:Array(12).fill(0),
  categorias:[],dividas:[],metas:[],projetos:[],sens:{rec:0,desp:0},sim:{inicial:0,aporte:1000,taxaAno:10,anos:5}};}
function novaCat(grupo,nome,prazo=0){return{id:uid(),grupo,nome,prev:zeros(),real:Array(H).fill(null),prazo};}
function basico(){
  const d=vazio();
  d.categorias=[
    novaCat("receita","Venda de produtos"),novaCat("receita","Prestação de serviços"),
    novaCat("deducao","Simples Nacional / impostos sobre vendas"),
    novaCat("custo","Custo das mercadorias e insumos"),novaCat("custo","Comissões sobre vendas"),novaCat("custo","Taxas de cartão e meios de pagamento"),
    novaCat("pessoal","Salários e encargos"),novaCat("pessoal","Pró-labore"),novaCat("pessoal","Benefícios"),
    novaCat("operacional","Aluguel e condomínio"),novaCat("operacional","Água, energia e internet"),novaCat("operacional","Contabilidade"),novaCat("operacional","Sistemas e software"),
    novaCat("comercial","Marketing e publicidade"),
    novaCat("fin_desp","Tarifas bancárias")
  ];
  return d;
}
// Converte cenários das versões anteriores (orçamento de um mês) para o modelo mensal
function migra(d){
  if(!d) return vazio();
  if(d.versao===3){
    const v=vazio(d.inicio||ymHoje); d={...v,...d}; d.sens={...v.sens,...(d.sens||{})}; d.sim={...v.sim,...(d.sim||{})};
    d.categorias=(d.categorias||[]).map(c=>({...novaCat(c.grupo||"operacional",c.nome),...c,prev:fix(c.prev,0),real:fix(c.real,null)}));
    d.dividas=(d.dividas||[]).map(x=>({sistema:"price",carencia:0,captacao:"",...x}));
    d.projetos=d.projetos||[]; if(!Array.isArray(d.sazonal)||d.sazonal.length!==12)d.sazonal=Array(12).fill(0);
    return d;
  }
  const n=vazio(d.mesRef||ymHoje); n.saldoInicial=num(d.saldoInicial); n.incluirMetas=d.incluirMetas!==false;
  if(Array.isArray(d.sazonal)&&d.sazonal.length===12) n.sazonal=d.sazonal.map(num);
  n.metas=d.metas||[]; n.sim={...n.sim,...(d.sim||{})};
  n.dividas=(d.dividas||[]).map(x=>({sistema:"price",carencia:0,captacao:"",...x}));
  n.categorias=(d.categorias||[]).map(c=>{
    const g=c.tipo==="receita"?"receita":c.natureza==="variavel"?"custo":"operacional";
    const nc=novaCat(g,c.nome); nc.id=c.id||nc.id;
    nc.prev=nc.prev.map((_,k)=>Math.round(num(c.previsto)*Math.pow(1+num(c.cresc)/100,k)*100)/100);
    if(num(c.realizado)) nc.real[0]=num(c.realizado);
    return nc;
  });
  return n;
}
function fix(a,fill){const r=Array.isArray(a)?a.slice(0,H):[];while(r.length<H)r.push(fill);return r.map(v=>v===null||v===""||v===undefined?fill:num(v));}
/* ============================ motor de cálculo ============================ */
const mesesDo=d=>[...Array(H)].map((_,k)=>addMes(d.inicio,k));
const idxMes=(d,ym)=>difMes(d.inicio,ym);

/* ---------- dívidas: tabela Price ou SAC, com carência (só juros) ---------- */
function cronograma(x){
  const P=num(x.valor),i=num(x.taxa)/100,n=Math.max(0,Math.round(num(x.parcelas))),c=Math.max(0,Math.round(num(x.carencia)));
  const rows=[];let saldo=P;if(!x.inicio||!P)return rows;
  for(let k=0;k<c;k++){const j=saldo*i;rows.push({ym:addMes(x.inicio,k),juros:j,amort:0,parcela:j,saldo,carencia:true});}
  const pmt=n?(i===0?P/n:P*i/(1-Math.pow(1+i,-n))):0;
  for(let k=0;k<n;k++){const j=saldo*i;const a=x.sistema==="sac"?P/n:pmt-j;saldo=Math.max(0,saldo-a);rows.push({ym:addMes(x.inicio,c+k),juros:j,amort:a,parcela:j+a,saldo});}
  return rows;
}
function infoDivida(x,ym){
  const rows=cronograma(x),antes=rows.filter(r=>r.ym<ym),daqui=rows.filter(r=>r.ym>=ym);
  const saldo=antes.length?antes[antes.length-1].saldo:num(x.valor);
  return{rows,pagas:antes.length,total:rows.length,restantes:daqui.length,saldo:daqui.length?saldo:0,
    proxima:daqui[0]||null,jurosRest:sum(daqui.map(r=>r.juros)),fim:rows.length?rows[rows.length-1].ym:""};
}

/* ---------- metas ---------- */
function infoMeta(m,ym){const n=Math.max(1,difMes(ym,m.prazo)),r=Math.pow(1+num(m.taxaAno)/100,1/12)-1,fv=num(m.atual)*Math.pow(1+r,n),falta=Math.max(0,num(m.alvo)-fv);
  const aporte=falta<=0?0:(r===0?falta/n:falta*r/(Math.pow(1+r,n)-1));return{n,aporte,progresso:num(m.alvo)?num(m.atual)/num(m.alvo):0};}

/* ---------- projeção: DRE (competência) e fluxo de caixa (caixa) ---------- */
function multiplicador(g,s){const t=G[g]?.tipo;if(t==="receita"||t==="variavel")return 1+num(s.rec)/100;if(t==="fixa")return 1+num(s.desp)/100;return 1;}
function projeta(d,sens=d.sens||{rec:0,desp:0}){
  const ms=mesesDo(d),comp={},cash={};
  for(const g of GRUPOS){comp[g.k]=zeros();cash[g.k]=zeros();}
  for(const c of d.categorias){
    const g=G[c.grupo]?c.grupo:"operacional",m=multiplicador(g,sens),p=Math.round(num(c.prazo)/30);
    for(let k=0;k<H;k++){
      comp[g][k]+=num(c.prev[k])*m;
      const src=k-p; cash[g][k]+=num(c.prev[src>=0?src:0])*m; // antes do horizonte, assume o nível do 1º mês
    }
  }
  const juros=zeros(),amort=zeros(),parcelas=zeros(),captacoes=zeros();
  for(const x of d.dividas){
    for(const r of cronograma(x)){const k=idxMes(d,r.ym);if(k>=0&&k<H){juros[k]+=r.juros;amort[k]+=r.amort;parcelas[k]+=r.parcela;}}
    if(x.captacao){const k=idxMes(d,x.captacao);if(k>=0&&k<H)captacoes[k]+=num(x.valor);}
  }
  const metas=zeros();
  if(d.incluirMetas)for(const m of d.metas){const a=infoMeta(m,d.inicio).aporte;for(let k=0;k<H;k++)if(ms[k]<=m.prazo)metas[k]+=a;}
  const A=(f)=>[...Array(H)].map((_,k)=>f(k));
  const rb=comp.receita,ded=comp.deducao,rl=A(k=>rb[k]-ded[k]),cv=comp.custo,mc=A(k=>rl[k]-cv[k]);
  const df=A(k=>comp.pessoal[k]+comp.operacional[k]+comp.comercial[k]),ebitda=A(k=>mc[k]-df[k]);
  const finDesp=A(k=>comp.fin_desp[k]+juros[k]),resFin=A(k=>comp.fin_rec[k]-finDesp[k]),lair=A(k=>ebitda[k]+resFin[k]);
  const ll=A(k=>lair[k]-comp.tributos[k]);
  const entOp=A(k=>cash.receita[k]+cash.fin_rec[k]);
  const saiOp=A(k=>["deducao","custo","pessoal","operacional","comercial","fin_desp","tributos"].reduce((t,g)=>t+cash[g][k],0));
  const fcOp=A(k=>entOp[k]-saiOp[k]),fcInv=A(k=>-cash.investimento[k]);
  const fcFin=A(k=>cash.aporte[k]-cash.retirada[k]+captacoes[k]-parcelas[k]);
  const liquido=A(k=>fcOp[k]+fcInv[k]+fcFin[k]-metas[k]);
  const saldo=[];let s=num(d.saldoInicial);for(let k=0;k<H;k++){s+=liquido[k];saldo.push(s);}
  const saidas=A(k=>saiOp[k]+cash.investimento[k]+cash.retirada[k]+parcelas[k]+metas[k]);
  const entradas=A(k=>entOp[k]+cash.aporte[k]+captacoes[k]);
  return{ms,comp,cash,juros,amort,parcelas,captacoes,metas,rb,ded,rl,cv,mc,df,ebitda,finDesp,resFin,lair,ll,
    entOp,saiOp,fcOp,fcInv,fcFin,liquido,saldo,entradas,saidas};
}
// DRE de um mês com valores realizados (null = não lançado)
function dreReal(d,k){
  const v=g=>sum(d.categorias.filter(c=>c.grupo===g).map(c=>num(c.real[k])));
  const P=projeta(d,{rec:0,desp:0});
  const rb=v("receita"),ded=v("deducao"),rl=rb-ded,cv=v("custo"),mc=rl-cv,df=v("pessoal")+v("operacional")+v("comercial"),ebitda=mc-df;
  const finDesp=v("fin_desp")+P.juros[k],resFin=v("fin_rec")-finDesp,lair=ebitda+resFin,ll=lair-v("tributos");
  const lancado=d.categorias.some(c=>c.real[k]!==null&&c.real[k]!==undefined);
  return{rb,ded,rl,cv,mc,df,ebitda,finDesp,resFin,lair,ll,lancado};
}
function indicadores(d,P=projeta(d)){
  const rbA=sum(P.rb),rlA=sum(P.rl),cvA=sum(P.cv),dedA=sum(P.ded),dfA=sum(P.df),ebA=sum(P.ebitda),llA=sum(P.ll);
  const mcPct=rbA?(rbA-dedA-cvA)/rbA:0;
  const fixosMes=(dfA+sum(P.finDesp)-sum(P.comp.fin_rec))/H;
  const pe=mcPct>0?fixosMes/mcPct:Infinity, rbMes=rbA/H;
  let min=Infinity,kMin=0;P.saldo.forEach((v,k)=>{if(v<min){min=v;kMin=k;}});
  const queima=-sum(P.liquido.map(v=>Math.min(0,v)))/Math.max(1,P.liquido.filter(v=>v<0).length);
  const medLiq=sum(P.liquido)/H;
  return{rbA,rlA,ebA,llA,rbMes,mcPct,pe,margemSeg:rbMes&&isFinite(pe)?(rbMes-pe)/rbMes:0,
    margemEbitda:rlA?ebA/rlA:0,margemLiq:rbA?llA/rbA:0,saldoFinal:P.saldo[H-1],saldoMin:min,mesMin:P.ms[kMin],
    runway:medLiq<0?Math.max(0,num(d.saldoInicial))/-medLiq:Infinity,queima,medLiq,
    comprometimento:rbA?sum(P.parcelas)/rbA:0,cobertura:sum(P.juros)?ebA/sum(P.juros):Infinity,
    crescimento:P.rb[0]?P.rb[H-1]/P.rb[0]-1:0,necessidade:Math.max(0,num(d.saldoMinimo)-min),
    mesesAbaixo:P.saldo.filter(v=>v<num(d.saldoMinimo)).length};
}
function saude(d,I){
  const lin=(v,a,b)=>clamp((v-a)/(b-a),0,1)*100;
  const temReceita=I.rbA>0;
  const comp=[
    ["Margem EBITDA",temReceita?lin(I.margemEbitda,0,0.2):0,pct(I.margemEbitda),"20% ou mais = nota máxima"],
    ["Margem de segurança",temReceita?lin(I.margemSeg,0,0.3):0,pct(I.margemSeg),"receita 30% acima do equilíbrio = máxima"],
    ["Liquidez projetada",I.saldoMin<0?0:lin(I.saldoMin,0,Math.max(1,num(d.saldoMinimo)||I.rbMes*0.5)),R(I.saldoMin),"menor saldo do ano vs. saldo mínimo desejado"],
    ["Endividamento",temReceita?100-lin(I.comprometimento,0.05,0.3):100,pct(I.comprometimento),"parcelas acima de 30% da receita = zero"],
    ["Resultado líquido",temReceita?lin(I.margemLiq,-0.05,0.12):0,pct(I.margemLiq),"margem líquida de 12% = máxima"]
  ];
  const nota=Math.round(sum(comp.map(c=>c[1]))/comp.length);
  return{nota,comp,status:nota>=70?["good","Saudável"]:nota>=40?["warn","Atenção"]:["bad","Crítico"]};
}

/* ---------- títulos (contas a pagar e receber) ---------- */
const emAberto=t=>!t.pago_em;
function semanas13(titulos,saldoBanco){
  const h=hojeISO(),out=[];let s=saldoBanco;
  for(let w=0;w<13;w++){
    const ini=addDias(h,7*w),fim=addDias(h,7*w+6);let rec=0,pag=0;
    for(const t of titulos){if(!emAberto(t))continue;const v=t.vencimento<h?h:t.vencimento;if(v>=ini&&v<=fim){if(t.tipo==="receber")rec+=num(t.valor);else pag+=num(t.valor);}}
    s+=rec-pag;out.push({ini,fim,rec,pag,saldo:s});
  }
  return out;
}
function aging(titulos,tipo){
  const h=hojeISO(),f=[["Vencidos há mais de 60 dias",-1e9,-61],["Vencidos 31–60 dias",-60,-31],["Vencidos 1–30 dias",-30,-1],["Vencem em até 30 dias",0,30],["31–60 dias",31,60],["61–90 dias",61,90],["Acima de 90 dias",91,1e9]];
  return f.map(([nome,a,b])=>{const it=titulos.filter(t=>t.tipo===tipo&&emAberto(t)&&difDias(h,t.vencimento)>=a&&difDias(h,t.vencimento)<=b);return{nome,valor:sum(it.map(t=>num(t.valor))),qtd:it.length,vencido:b<0};});
}

/* ---------- análise de investimentos ---------- */
function vpl(r,f){return f.reduce((t,v,i)=>t+v/Math.pow(1+r,i),0);}
function tir(f){
  if(!f.some(v=>v<0)||!f.some(v=>v>0))return null;
  let lo=-0.9999,hi=1,flo=vpl(lo,f),fhi=vpl(hi,f);
  while(flo*fhi>0&&hi<1e4){hi*=2;fhi=vpl(hi,f);}
  if(flo*fhi>0)return null;
  for(let i=0;i<300;i++){const m=(lo+hi)/2,fm=vpl(m,f);if(Math.abs(fm)<1e-9)return m;if(flo*fm<0){hi=m;fhi=fm;}else{lo=m;flo=fm;}}
  return(lo+hi)/2;
}
function mtir(f,rf,rr){const n=f.length-1;if(n<1)return null;let pv=0,fv=0;f.forEach((v,t)=>{if(v<0)pv+=v/Math.pow(1+rf,t);else fv+=v*Math.pow(1+rr,n-t);});return pv<0&&fv>0?Math.pow(fv/-pv,1/n)-1:null;}
function payback(f,r=0){let cum=0;for(let t=0;t<f.length;t++){const v=f[t]/Math.pow(1+r,t),ant=cum;cum+=v;if(t>0&&cum>=0&&ant<0)return t-1+(-ant)/v;}return null;}
function analisaProjeto(p){
  const anual=p.periodo!=="mes",tma=num(p.tma)/100,r=anual?tma:Math.pow(1+tma,1/12)-1;
  const fl=(p.fluxos||[]).map(num);if(fl.length)fl[fl.length-1]+=num(p.residual);
  const f=[-num(p.investimento),...fl];
  const t=tir(f),v=vpl(r,f),pvPos=sum(f.map((x,i)=>x>0?x/Math.pow(1+r,i):0)),pvNeg=-sum(f.map((x,i)=>x<0?x/Math.pow(1+r,i):0));
  const m=mtir(f,r,r);
  return{f,r,tir:t,tirAno:t==null?null:anual?t:Math.pow(1+t,12)-1,vpl:v,mtir:m,mtirAno:m==null?null:anual?m:Math.pow(1+m,12)-1,
    il:pvNeg?pvPos/pvNeg:null,pbs:payback(f,0),pbd:payback(f,r),roi:num(p.investimento)?(sum(fl)-num(p.investimento))/num(p.investimento):null,
    unidade:anual?"anos":"meses",viavel:v>0&&t!=null&&t>r};
}
/* ============================ gráficos (SVG) ============================ */
function niceTicks(min,max,count=5){if(min===max){max=min+1;}const span=max-min,mag=Math.pow(10,Math.floor(Math.log10(span/count))),step=[1,2,2.5,5,10].map(x=>x*mag).find(s=>span/s<=count)||10*mag,lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(6));return t;}
const kfmt=v=>{const a=Math.abs(v);return(v<0?"−":"")+(a>=1e6?nf1.format(a/1e6)+" mi":a>=1e3?Math.round(a/1e3)+" mil":Math.round(a));};
// bars e lines compartilham a mesma escala em R$ (um único eixo)
function chart({labels,bars=[],lines=[],h=250,stack=false,refLine=null,fmt=R}){
  const W=600,H_=h,pl=58,pr=14,pt=14,pb=30,iw=W-pl-pr,ih=H_-pt-pb,n=labels.length,bw=iw/n;
  let vals=[0,...lines.flatMap(s=>s.values)];
  if(stack){for(let i=0;i<n;i++){vals.push(sum(bars.map(s=>Math.max(0,s.values[i]))));vals.push(sum(bars.map(s=>Math.min(0,s.values[i]))));}}else vals.push(...bars.flatMap(s=>s.values));
  if(refLine!=null)vals.push(refLine.value);
  const ticks=niceTicks(Math.min(...vals),Math.max(...vals)),lo=ticks[0],hi=ticks[ticks.length-1],y=v=>pt+ih-(v-lo)/(hi-lo||1)*ih;
  let g=`<g class="grid">${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${kfmt(t)}</text>`).join("")}</g>`;
  const step=Math.ceil(n/12);
  labels.forEach((l,i)=>{if(i%step===0)g+=`<text x="${pl+bw*i+bw/2}" y="${H_-9}" text-anchor="middle">${esc(l)}</text>`;});
  const nb=stack?1:bars.length,gap=2,barW=Math.max(3,Math.min(26,(bw*0.72-gap*(nb-1))/Math.max(nb,1)));
  const rect=(x,v0,v1,color,round)=>{const a=y(v0),b=y(v1),top=Math.min(a,b),hh=Math.max(.5,Math.abs(a-b)),r=round?Math.min(3,barW/2,hh):0;
    if(!r)return`<rect x="${x}" y="${top}" width="${barW}" height="${hh}" fill="${color}"/>`;
    return v1>=v0?`<path d="M${x},${top+hh}V${top+r}Q${x},${top} ${x+r},${top}H${x+barW-r}Q${x+barW},${top} ${x+barW},${top+r}V${top+hh}Z" fill="${color}"/>`
                 :`<path d="M${x},${top}V${top+hh-r}Q${x},${top+hh} ${x+r},${top+hh}H${x+barW-r}Q${x+barW},${top+hh} ${x+barW},${top+hh-r}V${top}Z" fill="${color}"/>`;};
  for(let i=0;i<n;i++){
    const cx=pl+bw*i+bw/2;
    if(stack){let up=0,dn=0;bars.forEach((s,j)=>{const v=s.values[i];if(!v)return;const last=j===bars.length-1||bars.slice(j+1).every(t=>!t.values[i]||Math.sign(t.values[i])!==Math.sign(v));
      if(v>0){g+=rect(cx-barW/2,up,up+v,s.color,last);up+=v;}else{g+=rect(cx-barW/2,dn,dn+v,s.color,last);dn+=v;}});}
    else bars.forEach((s,j)=>{const v=s.values[i];if(!v)return;g+=rect(cx-(nb*barW+(nb-1)*gap)/2+j*(barW+gap),0,v,s.color,true);});
  }
  if(lo<0)g+=`<line class="zero" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>`;
  if(refLine)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(refLine.value)}" y2="${y(refLine.value)}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(refLine.value)-5}" text-anchor="end" style="fill:var(--bad)">${esc(refLine.label)}</text>`;
  lines.forEach(s=>{const pts=s.values.map((v,i)=>[pl+bw*i+bw/2,y(v)]);
    if(s.area)g+=`<path d="M${pts[0][0]},${y(Math.max(lo,0))}L${pts.map(p=>p.join(",")).join("L")}L${pts[pts.length-1][0]},${y(Math.max(lo,0))}Z" fill="${s.color}" opacity=".10"/>`;
    g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':""}/>`;
    const L=pts[pts.length-1];g+=`<circle cx="${L[0]}" cy="${L[1]}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;});
  for(let i=0;i<n;i++){const tip=[`<b>${esc(labels[i])}</b>`,...bars.map(s=>`<span class="tdot" style="--c:${s.color}"></span>${esc(s.name)}: ${fmt(s.values[i])}`),...lines.map(s=>`<span class="tdot" style="--c:${s.color}"></span>${esc(s.name)}: ${fmt(s.values[i])}`)].join("<br>");
    g+=`<rect class="hit" x="${pl+bw*i}" y="${pt}" width="${bw}" height="${ih}" data-tip="${esc(tip)}"/>`;}
  const leg=[...bars.map(s=>`<span style="--c:${s.color}">${esc(s.name)}</span>`),...lines.map(s=>`<span class="line" style="--c:${s.color}">${esc(s.name)}</span>`)];
  return`<svg class="chart" viewBox="0 0 ${W} ${H_}" role="img" aria-label="Gráfico">${g}</svg>${leg.length>1?`<div class="legend">${leg.join("")}</div>`:""}`;
}
function spark(values,color="var(--accent)"){
  if(!values.length||values.every(v=>!v))return"";
  const W=120,H_=32,mn=Math.min(...values),mx=Math.max(...values),y=v=>H_-3-(v-mn)/((mx-mn)||1)*(H_-6),x=i=>i*(W/(values.length-1||1));
  const p=values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return`<svg class="spark" viewBox="0 0 ${W} ${H_}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${x(values.length-1)}" cy="${y(values[values.length-1])}" r="2.6" fill="${color}"/></svg>`;
}
function gauge(nota,status){
  const a=Math.PI*(1-nota/100),cx=110,cy=104,r=86,x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);
  const cor=status==="good"?"var(--good)":status==="warn"?"var(--warn)":"var(--bad)";
  return`<svg viewBox="0 0 220 124" class="gauge" role="img" aria-label="Nota ${nota} de 100">
    <path d="M24,104 A86,86 0 0 1 196,104" fill="none" stroke="var(--surface-2)" stroke-width="16" stroke-linecap="round"/>
    ${nota>0?`<path d="M24,104 A86,86 0 0 1 ${x.toFixed(1)},${y.toFixed(1)}" fill="none" stroke="${cor}" stroke-width="16" stroke-linecap="round"/>`:""}
    <text x="110" y="92" text-anchor="middle" class="gauge-n">${nota}</text><text x="110" y="114" text-anchor="middle" class="gauge-l">de 100</text></svg>`;
}
// barras horizontais em HTML (rótulo, barra, valor)
function hbars(items,{fmt=R,color="var(--accent)",max}={}){
  const m=max||Math.max(1,...items.map(i=>Math.abs(i.valor)));
  return`<div class="hbars">${items.map(i=>`<div class="hb" data-tip="${esc(`<b>${esc(i.nome)}</b><br>${fmt(i.valor)}${i.extra?"<br>"+i.extra:""}`)}"><div class="hb-l">${esc(i.nome)}</div><div class="hb-t"><i style="width:${(Math.abs(i.valor)/m*100).toFixed(1)}%;background:${i.color||color}"></i>${i.ref!=null?`<b style="left:${clamp(i.ref/m*100,0,100).toFixed(1)}%"></b>`:""}</div><div class="hb-v">${fmt(i.valor)}${i.sub?`<small>${i.sub}</small>`:""}</div></div>`).join("")}</div>`;
}

const chk=({data,error})=>{if(error)throw new Error(traduzErro(error.message));return data;};
function traduzErro(m=""){
  if(/relation .* does not exist|could not find the table/i.test(m))return"O banco ainda não tem as tabelas desta versão. Rode o script SQL atualizado no Supabase.";
  if(/row-level security|permission denied/i.test(m))return"Sem permissão para esta empresa. Peça ao responsável para liberar seu e-mail.";
  if(/JWT|token/i.test(m))return"Sua sessão expirou. Entre novamente.";
  return m;
}
const store={
  async list(t,eid,ordem){
    if(ONLINE){let all=[],from=0;for(;;){let q=sb.from(TAB[t]).select("*").eq("empresa_id",eid);if(ordem)q=q.order(ordem);const data=chk(await q.range(from,from+999));all=all.concat(data);if(data.length<1000)break;from+=1000;}return all;}
    return local.db()[t].filter(x=>x.empresa_id===eid);
  },
  async ins(t,rows){
    rows=(Array.isArray(rows)?rows:[rows]).map(r=>({id:uid(),criado_em:new Date().toISOString(),...r}));
    if(ONLINE){const clean=rows.map(({criado_em,...r})=>r);chk(await sb.from(TAB[t]).insert(clean));return rows;}
    const db=local.db();db[t].push(...rows);local.put(db);return rows;
  },
  async upd(t,id,patch){
    if(ONLINE){chk(await sb.from(TAB[t]).update(patch).eq("id",id));return;}
    const db=local.db(),x=db[t].find(r=>r.id===id);if(x){Object.assign(x,patch);local.put(db);}
  },
  async del(t,id){
    if(ONLINE){chk(await sb.from(TAB[t]).delete().eq("id",id));return;}
    const db=local.db();db[t]=db[t].filter(r=>r.id!==id);
    if(t==="contas"){db.movs=db.movs.filter(m=>m.conta_id!==id&&m.conta_destino_id!==id);}
    if(t==="empresas")for(const k of ["planos","contas","movs","titulos","usuarios"])db[k]=db[k].filter(r=>r.empresa_id!==id);
    local.put(db);
  },
  async listEmpresas(){
    if(ONLINE)return chk(await sb.from("empresas").select("*").order("nome"));
    return local.db().empresas.sort((a,b)=>a.nome.localeCompare(b.nome));
  },
  async getEmpresa(id){
    if(ONLINE){const r=chk(await sb.from("empresas").select("*").eq("id",id));return r[0]||null;}
    return local.db().empresas.find(e=>e.id===id)||null;
  },
  async listPlanos(eid){
    if(ONLINE)return chk(await sb.from("planejamentos").select("id,nome,criado_em,atualizado_em,atualizado_por").eq("empresa_id",eid).order("criado_em"));
    return local.db().planos.filter(p=>p.empresa_id===eid).map(({dados,...p})=>p);
  },
  async getPlano(id){
    if(ONLINE){const r=chk(await sb.from("planejamentos").select("*").eq("id",id));return r[0];}
    return local.db().planos.find(p=>p.id===id);
  },
  async salvaPlano(id,patch){
    if(ONLINE){chk(await sb.from("planejamentos").update(patch).eq("id",id));return;}
    const db=local.db(),p=db.planos.find(p=>p.id===id);if(p){Object.assign(p,patch,{atualizado_em:new Date().toISOString()});local.put(db);}
  }
};

async function entrarCartao(id,login,senha){
  if(ONLINE){
    if(!(S.user&&S.user.email.toLowerCase()===login.toLowerCase())){
      if(S.user)await sb.auth.signOut();
      const{data,error}=await sb.auth.signInWithPassword({email:login,password:senha});
      if(error)throw new Error(/invalid/i.test(error.message)?"E-mail ou senha incorretos.":error.message);
      S.user=data.user;
    }
  }else{
    const e=local.db().empresas.find(x=>x.id===id);
    if(!e)throw new Error("Empresa não encontrada neste navegador.");
    const h=await sha256(e.id+":"+senha);
    if(String(e.login||"").toLowerCase()!==login.trim().toLowerCase()||h!==e.senha_hash)throw new Error("Login ou senha incorretos.");
    ssSet("pf-ok-"+id,"1");
  }
  await abrirEmpresa(id);
}

  const{data,error}=await sb.auth.signInWithPassword({email:login,password:senha});

/* ============================ helpers de tela ============================ */
const kpi=(lbl,val,sub="",{cls="",sp="",tag=""}={})=>`<div class="kpi ${sp?"has-spark":""}"><div class="lbl"><span>${lbl}</span>${tag}</div><div class="val ${cls}">${val}</div>${sub?`<div class="sub">${sub}</div>`:""}${sp}</div>`;
const panel=(titulo,corpo,{sub="",acoes="",id="",cls=""}={})=>`<section class="panel ${cls}" ${id?`id="${id}"`:""}><div class="panel-h"><div><h3>${titulo}</h3>${sub?`<p>${sub}</p>`:""}</div>${acoes?`<div class="row c">${acoes}</div>`:""}</div>${corpo}</section>`;
const fmtIn=v=>v==null||v===""?"":Number(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
const sinal=v=>v>0?"+":"";
const deltaChip=(v,bomQuandoSobe=true)=>{if(v==null||!isFinite(v))return"";const bom=bomQuandoSobe?v>=0:v<=0;return`<span class="delta ${bom?"pos":"neg"}">${v>=0?"▲":"▼"} ${pct(Math.abs(v))}</span>`;};
// bancos e títulos (usados em várias telas)
const contaNome=id=>S.contas.find(c=>c.id===id)?.nome||"—";
function efeito(m,contaId){const v=num(m.valor);if(m.tipo==="entrada")return(!contaId||m.conta_id===contaId)?v:0;if(m.tipo==="saida")return(!contaId||m.conta_id===contaId)?-v:0;if(!contaId)return 0;return(m.conta_id===contaId?-v:0)+(m.conta_destino_id===contaId?v:0);}
function saldoAte(contaId,limite){const cs=contaId?S.contas.filter(c=>c.id===contaId):S.contas;let s=sum(cs.map(c=>num(c.saldo_inicial)));for(const m of S.movs)if(!limite||m.data<limite)s+=efeito(m,contaId);return s;}
const saldoBancos=()=>saldoAte("","");
function aberto30(tipo){const lim=addDias(hojeISO(),30);return sum(S.titulos.filter(t=>t.tipo===tipo&&emAberto(t)&&t.vencimento<=lim).map(t=>num(t.valor)));}

/* ============================ PAINEL ============================ */
function telaPainel(){
  const d=S.dados,P=projeta(d),I=indicadores(d,P),SA=saude(d,I),k=idxMes(d,d.mesRef),ms=P.ms.map(rotMes);
  const temPlano=I.rbA>0||sum(P.saidas)>0;
  const bancos=saldoBancos(),rec30=aberto30("receber"),pag30=aberto30("pagar");
  const vencidos=S.titulos.filter(t=>emAberto(t)&&t.vencimento<hojeISO());
  const DR=dreReal(d,k);
  // alertas
  const al=[];
  if(!temPlano)al.push(["info","Comece pelo planejamento","Preencha receitas e despesas mensais em Planejamento (DRE). O painel se monta a partir delas."]);
  else{
    const neg=P.saldo.findIndex(v=>v<0);if(neg>=0)al.push(["bad","Caixa negativo projetado",`O saldo fica negativo em ${ms[neg]} (${R(P.saldo[neg])}). Necessidade de capital: ${R(-I.saldoMin)}.`]);
    else if(num(d.saldoMinimo)&&I.mesesAbaixo)al.push(["warn","Abaixo do saldo mínimo",`${I.mesesAbaixo} mês(es) abaixo do saldo mínimo de ${R(d.saldoMinimo)}.`]);
    if(I.rbMes&&I.rbMes<I.pe)al.push(["bad","Receita abaixo do ponto de equilíbrio",`Receita média de ${R(I.rbMes)} contra equilíbrio de ${isFinite(I.pe)?R(I.pe):"—"} por mês.`]);
    else if(I.rbMes&&I.margemSeg<0.15)al.push(["warn","Margem de segurança baixa",`A receita está só ${pct(I.margemSeg)} acima do ponto de equilíbrio.`]);
    if(I.comprometimento>0.15)al.push(["warn","Dívidas pesando no caixa",`Parcelas consomem ${pct(I.comprometimento)} da receita.`]);
    if(isFinite(I.cobertura)&&I.cobertura<1.5&&sum(P.juros)>0)al.push(["warn","Cobertura de juros baixa",`O EBITDA cobre ${nf1.format(I.cobertura)}× os juros (ideal acima de 3×).`]);
    if(I.crescimento<-0.05)al.push(["warn","Receita em queda no ano",`A receita do último mês é ${pct(Math.abs(I.crescimento))} menor que a do primeiro.`]);
  }
  if(vencidos.length)al.push(["bad","Títulos vencidos",`${vencidos.length} título(s) em aberto vencido(s): ${R(sum(vencidos.filter(t=>t.tipo==="receber").map(t=>num(t.valor))))} a receber e ${R(sum(vencidos.filter(t=>t.tipo==="pagar").map(t=>num(t.valor))))} a pagar.`]);
  if(DR.lancado){const pr=P.ll[k];if(DR.ll<pr-Math.abs(pr)*0.1)al.push(["warn",`Resultado de ${rotMes(d.mesRef)} abaixo do previsto`,`Lucro realizado ${R(DR.ll)} contra ${R(pr)} previsto.`]);}
  if(!al.length)al.push(["good","Tudo dentro do planejado","Nenhum ponto de atenção no momento."]);
  const rot={good:"OK",bad:"Crítico",warn:"Atenção",info:"Início"};
  // composição das despesas no ano
  const desp=["deducao","custo","pessoal","operacional","comercial","fin_desp","tributos"].map(g=>({nome:G[g].nome,valor:g==="fin_desp"?sum(P.finDesp):sum(P.comp[g])})).filter(x=>x.valor>0).sort((a,b)=>b.valor-a.valor);
  const totDesp=sum(desp.map(x=>x.valor));desp.forEach(x=>x.sub=pct(x.valor/totDesp));
  // previsto x realizado do mês (maiores categorias)
  const pxr=d.categorias.filter(c=>num(c.prev[k])||num(c.real[k])).map(c=>({nome:c.nome,valor:num(c.real[k]),ref:num(c.prev[k]),g:c.grupo,
    sub:`prev. ${R(c.prev[k])}`,color:(G[c.grupo].sinal>0?num(c.real[k])>=num(c.prev[k])*0.95:num(c.real[k])<=num(c.prev[k])*1.05)?"var(--s-in)":"var(--bad)"})).sort((a,b)=>b.ref-a.ref).slice(0,8);
  // próximos vencimentos
  const prox=S.titulos.filter(emAberto).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).slice(0,8);
  const sem=semanas13(S.titulos,bancos);
  const dreLin=[["Receita bruta",P.rb,DR.rb,"b"],["(−) Deduções",P.ded,DR.ded],["Receita líquida",P.rl,DR.rl,"b"],["(−) Custos variáveis",P.cv,DR.cv],["Margem de contribuição",P.mc,DR.mc,"s"],["(−) Despesas fixas",P.df,DR.df],["EBITDA",P.ebitda,DR.ebitda,"s"],["Resultado financeiro",P.resFin,DR.resFin],["(−) IRPJ e CSLL",P.comp.tributos,num(DR.lair-DR.ll)],["Lucro líquido",P.ll,DR.ll,"s"]];
  return`
  <div class="kpis">
    ${kpi("Receita prevista · 12 meses",R(I.rbA),`${R(I.rbMes)}/mês ${deltaChip(I.crescimento)}`,{sp:spark(P.rb,"var(--s-in)")})}
    ${kpi("EBITDA · 12 meses",R(I.ebA),`margem ${pct(I.margemEbitda)}`,{cls:I.ebA<0?"neg":"",sp:spark(P.ebitda,"var(--accent)")})}
    ${kpi("Lucro líquido · 12 meses",R(I.llA),`margem ${pct(I.margemLiq)}`,{cls:I.llA<0?"neg":"",sp:spark(P.ll,"var(--accent)")})}
    ${kpi("Saldo de caixa no fim",R(I.saldoFinal),`mínimo ${R(I.saldoMin)} em ${rotMes(I.mesMin)}`,{cls:I.saldoFinal<0?"neg":"",sp:spark(P.saldo,"var(--s-bal)")})}
    ${kpi("Saldo em bancos · hoje",S.contas.length?R(bancos):"—",S.contas.length?`${S.contas.length} conta(s)`:`<button class="linkbtn" data-act="pag" data-pag="bancos">Cadastrar contas</button>`,{cls:bancos<0?"neg":""})}
    ${kpi("Capital de giro · 30 dias",R(rec30-pag30),`receber ${R(rec30)} · pagar ${R(pag30)}`,{cls:rec30-pag30<0?"neg":""})}
    ${kpi("Ponto de equilíbrio · mês",isFinite(I.pe)?R(I.pe):"—",`margem de segurança ${I.rbMes&&isFinite(I.pe)?pct(I.margemSeg):"—"}`,{cls:I.margemSeg<0?"neg":""})}
    ${kpi("Fôlego de caixa",isFinite(I.runway)?nf1.format(I.runway)+" meses":"Geração positiva",`resultado de caixa médio ${R(I.medLiq)}/mês`,{cls:isFinite(I.runway)&&I.runway<6?"neg":""})}
  </div>
  <div class="grid g-21">
    ${panel("Fluxo de caixa projetado",chart({labels:ms,bars:[{name:"Entradas",color:"var(--s-in)",values:P.entradas},{name:"Saídas",color:"var(--s-out)",values:P.saidas}],lines:[{name:"Saldo acumulado",color:"var(--s-bal)",values:P.saldo}],refLine:num(d.saldoMinimo)?{value:num(d.saldoMinimo),label:"saldo mínimo"}:null,h:270}),{sub:`Cenário “${esc(S.nome)}” · ${ms[0]} a ${ms[H-1]}`,acoes:`<button class="btn small" data-act="pag" data-pag="fluxo">Detalhar</button>`})}
    ${panel("Saúde financeira",`${gauge(SA.nota,SA.status[0])}<div style="text-align:center;margin-top:-4px"><span class="chip ${SA.status[0]}">${SA.status[1]}</span></div>
      <div class="score-list">${SA.comp.map(([n,v,t,h])=>`<div class="score-item" data-tip="${esc(`<b>${n}</b><br>${h}`)}"><span>${n}</span><div class="mini"><i style="width:${v}%;background:${v>=70?"var(--good)":v>=40?"var(--warn)":"var(--bad)"}"></i></div><span class="muted" style="text-align:right">${Math.round(v)}</span></div>`).join("")}</div>`,{sub:"Nota de 0 a 100 a partir de cinco indicadores"})}
  </div>
  <div class="grid g-21">
    ${panel("DRE gerencial",`<div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Linha</th><th class="n">12 meses</th><th class="n">Previsto ${rotMes(d.mesRef)}</th><th class="n">Realizado</th><th class="n">Variação</th></tr></thead><tbody>
      ${dreLin.map(([n,arr,real,st])=>{const a=sum(arr),p=arr[k],v=real-p;return`<tr class="${st==="s"?"sub":""}"><td class="${st?"dre-k":""}">${n}</td><td class="n" data-tip="${esc(I.rbA?pct(a/I.rbA)+" da receita bruta":"")}">${R(a)}</td><td class="n">${R(p)}</td><td class="n">${DR.lancado?R(real):'<span class="muted">—</span>'}</td><td class="n ${DR.lancado?(v>=0?"pos":"neg"):""}">${DR.lancado?sinal(v)+R(v):""}</td></tr>`;}).join("")}
      </tbody></table></div>`,{sub:DR.lancado?`Realizado de ${rotMes(d.mesRef)} lançado`:`Lance o realizado de ${rotMes(d.mesRef)} em Planejamento ou pelas contas bancárias`,acoes:`<button class="btn small" data-act="pag" data-pag="plan">Abrir DRE</button>`})}
    ${panel("Pontos de atenção",`<ul class="alerts">${al.slice(0,7).map(([t,a,b])=>`<li><span class="chip ${t}">${rot[t]}</span><div><b>${a}</b><br><span class="muted">${b}</span></div></li>`).join("")}</ul>`)}
  </div>
  <div class="grid g3">
    ${panel("Composição das despesas",desp.length?hbars(desp,{color:"var(--s-out)"}):`<div class="empty">Sem despesas planejadas.</div>`,{sub:"12 meses, por grupo da DRE"})}
    ${panel(`Previsto × realizado · ${rotMes(d.mesRef)}`,pxr.length?hbars(pxr):`<div class="empty">Nada planejado para o mês.</div>`,{sub:"Barra = realizado · traço = previsto"})}
    ${panel("Próximos vencimentos",prox.length?`<div class="list">${prox.map(t=>{const dd=difDias(hojeISO(),t.vencimento);return`<div class="item"><div style="min-width:0"><b style="font-size:.86rem">${esc(t.descricao||t.contraparte||"Título")}</b><div class="muted" style="font-size:.76rem">${dataBR(t.vencimento)} · ${esc(t.contraparte||"")}</div></div><div style="text-align:right"><b class="${t.tipo==="receber"?"pos":"neg"}">${t.tipo==="receber"?"+":"−"}${R(t.valor)}</b><div>${dd<0?`<span class="chip bad">vencido há ${-dd}d</span>`:dd===0?`<span class="chip warn">hoje</span>`:`<span class="chip plain">em ${dd}d</span>`}</div></div></div>`;}).join("")}</div>`:`<div class="empty">Nenhum título em aberto. <button class="linkbtn" data-act="pag" data-pag="titulos">Lançar contas a pagar e receber</button></div>`)}
  </div>
  ${panel("Fluxo de caixa de 13 semanas",S.contas.length||S.titulos.length?chart({labels:sem.map(s=>dataBR(s.ini).slice(0,5)),bars:[{name:"Recebimentos",color:"var(--s-in)",values:sem.map(s=>s.rec)},{name:"Pagamentos",color:"var(--s-out)",values:sem.map(s=>s.pag)}],lines:[{name:"Saldo projetado",color:"var(--s-bal)",values:sem.map(s=>s.saldo),area:true}],h:170}):`<div class="empty">Cadastre contas bancárias e títulos a pagar e receber para ver a projeção semanal.</div>`,{sub:"Saldo bancário de hoje + títulos em aberto (vencidos entram nesta semana)"})}`;
}

/* ============================ PLANEJAMENTO (DRE MENSAL) ============================ */
const DRE_ORDEM=[
  ["g","receita"],["g","deducao"],["t","Receita líquida","rl"],["g","custo"],["t","Margem de contribuição","mc"],
  ["g","pessoal"],["g","operacional"],["g","comercial"],["t","EBITDA","ebitda"],
  ["g","fin_rec"],["g","fin_desp"],["j"],["t","Resultado antes dos tributos","lair"],["g","tributos"],["t","Lucro líquido","ll"],
  ["h","Itens de caixa fora da DRE"],["g","investimento"],["g","aporte"],["g","retirada"]
];
function telaPlan(){
  const d=S.dados,P=projeta(d,{rec:0,desp:0}),ms=P.ms,modo=U.planModo||"prev",k=idxMes(d,d.mesRef);
  const seg=`<div class="seg" role="group" aria-label="Visão">${[["prev","Previsto"],["real","Realizado"],["comp","Previsto × realizado"]].map(([v,t])=>`<button data-act="planModo" data-v="${v}" aria-pressed="${modo===v}">${t}</button>`).join("")}</div>`;
  const barra=`<div class="toolbar">${seg}<div class="row">
    <div class="field"><label for="inicioPlan">1º mês do planejamento</label><input id="inicioPlan" type="month" value="${d.inicio}"></div>
    <button class="btn" data-act="rolar" title="Avança um mês: o primeiro sai e um novo entra no fim, repetindo a tendência">Rolar previsão +1 mês</button>
    <button class="btn" data-act="copiarDRE">Copiar tabela</button><span class="note" id="copMsg"></span></div></div>`;
  if(modo==="comp")return barra+telaComparativo(d,P,k);
  const campo=modo==="real"?"real":"prev";
  const cats=d.categorias.map((c,i)=>[c,i]);
  const linhaTot=(nome,arr,cls)=>`<tr class="${cls}"><td class="sticky">${nome}</td><td></td>${arr.map(v=>`<td class="n ${v<0?"neg":""}">${R(v)}</td>`).join("")}<td class="n ${sum(arr)<0?"neg":""}">${R(sum(arr))}</td><td></td></tr>`;
  const realDe=g=>[...Array(H)].map((_,m)=>sum(d.categorias.filter(c=>c.grupo===g).map(c=>num(c.real[m]))));
  const RV=modo==="real"?(()=>{const o={};for(let m=0;m<H;m++){const r=dreReal(d,m);for(const key of ["rl","mc","ebitda","lair","ll"]){(o[key]=o[key]||[]).push(r[key]);}}o.juros=P.juros;return o;})():null;
  let body="";

function telaComparativo(d,P,k){
  const R_=dreReal(d,k);
  const linhas=[];
  for(const it of DRE_ORDEM){
    if(it[0]==="h"){linhas.push(`<tr class="grp"><td colspan="6">${it[1]}</td></tr>`);continue;}
    if(it[0]==="j"){if(P.juros[k])linhas.push(`<tr><td class="muted">Juros de dívidas (automático)</td><td class="n muted">${R(P.juros[k])}</td><td class="n muted">${R(P.juros[k])}</td><td></td><td></td><td></td></tr>`);continue;}
    if(it[0]==="t"){const p=P[it[2]][k],r=R_[it[2]],v=r-p;linhas.push(`<tr class="sub"><td>${it[1]}</td><td class="n">${R(p)}</td><td class="n">${R(r)}</td><td class="n">${sinal(v)}${R(v)}</td><td class="n">${p?pct(v/Math.abs(p)):"—"}</td><td></td></tr>`);continue;}
    const g=it[1],cs=d.categorias.filter(c=>c.grupo===g);if(!cs.length)continue;
    const bom=v=>G[g].sinal>0?v>=0:v<=0;
    const pT=sum(cs.map(c=>num(c.prev[k]))),rT=sum(cs.map(c=>num(c.real[k])));
    linhas.push(`<tr class="grp"><td>${G[g].nome}</td><td class="n">${R(pT)}</td><td class="n">${R(rT)}</td><td class="n ${bom(rT-pT)?"var-good":"var-bad"}">${sinal(rT-pT)}${R(rT-pT)}</td><td class="n">${pT?pct((rT-pT)/pT):"—"}</td><td></td></tr>`);
    for(const c of cs){const p=num(c.prev[k]),r=c.real[k],v=num(r)-p,dv=p?v/p:0;
      const st=r==null?`<span class="chip plain">sem lançamento</span>`:Math.abs(dv)<=0.05?`<span class="chip good">no previsto</span>`:bom(v)?`<span class="chip good">${G[g].sinal>0?"acima":"abaixo"}</span>`:`<span class="chip bad">${G[g].sinal>0?"abaixo":"acima"} ${pct(Math.abs(dv),0)}</span>`;
      linhas.push(`<tr><td style="padding-left:22px">${esc(c.nome)}</td><td class="n">${R(p)}</td><td class="n">${r==null?'<span class="muted">—</span>':R(r)}</td><td class="n ${r==null?"":bom(v)?"var-good":"var-bad"}">${r==null?"":sinal(v)+R(v)}</td><td class="n">${r==null||!p?"":pct(dv)}</td><td>${st}</td></tr>`);}
  }
  // acumulado do ano até o mês de análise
  const acP=sum(P.ll.slice(0,k+1)),acR=sum([...Array(k+1)].map((_,m)=>dreReal(d,m).ll));
  return`<div class="kpis">
    ${kpi(`Receita · ${rotMes(d.mesRef)}`,R(R_.rb),`previsto ${R(P.rb[k])} ${P.rb[k]?deltaChip(R_.rb/P.rb[k]-1):""}`)}
    ${kpi(`EBITDA · ${rotMes(d.mesRef)}`,R(R_.ebitda),`previsto ${R(P.ebitda[k])}`,{cls:R_.ebitda<0?"neg":""})}
    ${kpi(`Lucro líquido · ${rotMes(d.mesRef)}`,R(R_.ll),`previsto ${R(P.ll[k])}`,{cls:R_.ll<0?"neg":""})}

  </div>
  <div class="tbl-wrap"><table><thead><tr><th>Linha da DRE · ${rotMes(d.mesRef)}</th><th class="n">Previsto</th><th class="n">Realizado</th><th class="n">Variação R$</th><th class="n">Variação %</th><th>Situação</th></tr></thead><tbody>${linhas.join("")}</tbody></table></div>
  <p class="note" style="margin:0">Troque o mês no seletor “Mês de análise” no topo. A situação considera ±5% como dentro do previsto.</p>`;

function linhasFluxo(P){
  const neg=a=>a.map(v=>-v);
  return[
    ["Saldo inicial",P.saldo.map((v,k)=>v-P.liquido[k]),"grp"],
    ["(+) Recebimentos de vendas",P.cash.receita],["(+) Receitas financeiras",P.cash.fin_rec],
    ["(−) Impostos sobre vendas e deduções",neg(P.cash.deducao)],["(−) Custos variáveis",neg(P.cash.custo)],["(−) Pessoal",neg(P.cash.pessoal)],
    ["(−) Administrativas e ocupação",neg(P.cash.operacional)],["(−) Comerciais e marketing",neg(P.cash.comercial)],["(−) Despesas financeiras",neg(P.cash.fin_desp)],["(−) IRPJ e CSLL",neg(P.cash.tributos)],
    ["= Fluxo das operações",P.fcOp,"sub"],
    ["(−) Investimentos (CAPEX)",neg(P.cash.investimento)],["= Fluxo de investimentos",P.fcInv,"sub"],
    ["(+) Captação de empréstimos",P.captacoes],["(+) Aportes de sócios",P.cash.aporte],["(−) Parcelas de dívidas (juros + amortização)",neg(P.parcelas)],["(−) Distribuição de lucros e retiradas",neg(P.cash.retirada)],
    ["= Fluxo de financiamentos",P.fcFin,"sub"],
    ["(−) Aportes em metas e reservas",neg(P.metas)],
    ["= Variação do caixa",P.liquido,"sub"],["Saldo final",P.saldo,"tot"]
  ];
}

/* ============================ DÍVIDAS ============================ */
function telaDividas(){
  const d=S.dados,ym=d.mesRef,inf=d.dividas.map(x=>infoDivida(x,ym)),P=projeta(d);
  const saldoT=sum(inf.map(x=>x.saldo)),parc=sum(d.dividas.map(x=>cronograma(x).filter(r=>r.ym===ym).reduce((t,r)=>t+r.parcela,0)));
  const taxaMed=saldoT?sum(d.dividas.map((x,j)=>num(x.taxa)*inf[j].saldo))/saldoT:0;
  const sel=Math.min(num(U.divSel||0),Math.max(0,d.dividas.length-1)),X=d.dividas[sel],XI=inf[sel];
  let sim="";
  if(X&&XI.restantes>0){
    const extra=num(U.extra??10000),i=num(X.taxa)/100,novo=Math.max(0,XI.saldo-extra),rest=XI.rows.filter(r=>r.ym>=ym&&!r.carencia),n=rest.length||1;
    const jurosAntes=sum(XI.rows.filter(r=>r.ym>=ym).map(r=>r.juros));
    if(novo<=0)sim=`<p>Com ${R(extra)} a dívida é quitada (saldo ${R(XI.saldo)}), economizando <b class="pos">${R(jurosAntes)}</b> em juros.</p>`;
    else{
      const pmt=rest[0]?.parcela||0,amort=rest[0]?.amort||novo/n;
      const nPrazo=X.sistema==="sac"?Math.ceil(novo/(num(X.valor)/num(X.parcelas)||1)):(i===0?Math.ceil(novo/pmt):Math.ceil(-Math.log(1-novo*i/pmt)/Math.log(1+i)));
      const jA=cronograma({valor:novo,taxa:X.taxa,parcelas:nPrazo,inicio:ym,sistema:X.sistema}).reduce((t,r)=>t+r.juros,0);
      const cB=cronograma({valor:novo,taxa:X.taxa,parcelas:n,inicio:ym,sistema:X.sistema}),jB=sum(cB.map(r=>r.juros));
      sim=`<div class="grid g2" style="gap:12px"><div class="item" style="display:block"><b>Reduzir o prazo</b><div class="note">mantém a parcela</div><div style="margin-top:6px">${XI.restantes} → <b>${nPrazo}</b> parcelas · termina em ${rotMes(addMes(ym,nPrazo-1))}</div><div>Economia de juros: <b class="pos">${R(jurosAntes-jA)}</b></div></div>
        <div class="item" style="display:block"><b>Reduzir a parcela</b><div class="note">mantém o prazo</div><div style="margin-top:6px">Parcela: ${R2(pmt)} → <b>${R2(cB[0]?.parcela||0)}</b></div><div>Economia de juros: <b class="pos">${R(jurosAntes-jB)}</b></div></div></div>`;
    }
  }
  const crono=X?XI.rows:[];
  return`
  <div class="kpis">
    ${kpi("Saldo devedor total",R(saldoT),`em ${rotMes(ym)}`)}
    ${kpi(`Parcelas em ${rotMes(ym)}`,R(parc),I_comp(parc,P))}
    ${kpi("Juros no planejamento",R(sum(P.juros)),"12 meses · entram na DRE")}
    ${kpi("Juros a pagar até o fim",R(sum(inf.map(x=>x.jurosRest))),"todos os contratos")}
    ${kpi("Custo médio da dívida",saldoT?nf1.format(taxaMed)+"% a.m.":"—",saldoT?pct(Math.pow(1+taxaMed/100,12)-1)+" ao ano":"")}
  </div>
  ${panel("Contratos",d.dividas.length?`<div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Contrato</th><th class="n">Valor</th><th class="n">Juros % a.m.</th><th class="n">Parcelas</th><th class="n">Carência</th><th>Sistema</th><th>1ª parcela</th><th>Entrada do dinheiro</th><th class="n">Parcela atual</th><th class="n">Saldo</th><th>Término</th><th></th></tr></thead><tbody>
    ${d.dividas.map((x,j)=>{const f=inf[j];return`<tr class="${j===sel?"sub":""}">
      <td class="cell"><input class="name" id="dvn_${j}" data-bind="dividas.${j}.nome" value="${esc(x.nome)}" style="min-width:180px"></td>
      <td class="cell"><input id="dvv_${j}" type="number" step="1000" data-bind="dividas.${j}.valor" data-num value="${num(x.valor)}"></td>
      <td class="cell"><input id="dvt_${j}" type="number" step="0.01" data-bind="dividas.${j}.taxa" data-num value="${num(x.taxa)}" style="min-width:70px"></td>
      <td class="cell"><input id="dvp_${j}" type="number" step="1" min="1" data-bind="dividas.${j}.parcelas" data-num value="${num(x.parcelas)}" style="min-width:64px"></td>
      <td class="cell"><input id="dvc_${j}" type="number" step="1" min="0" data-bind="dividas.${j}.carencia" data-num value="${num(x.carencia)}" style="min-width:60px" title="Meses pagando só juros"></td>
      <td class="cell"><select id="dvs_${j}" data-bind="dividas.${j}.sistema"><option value="price" ${x.sistema!=="sac"?"selected":""}>Price</option><option value="sac" ${x.sistema==="sac"?"selected":""}>SAC</option></select></td>
      <td class="cell"><input id="dvi_${j}" type="month" data-bind="dividas.${j}.inicio" value="${x.inicio}" style="min-width:130px"></td>
      <td class="cell"><input id="dvk_${j}" type="month" data-bind="dividas.${j}.captacao" data-empty value="${x.captacao||""}" style="min-width:130px" title="Preencha se o dinheiro ainda vai entrar no caixa"></td>
      <td class="n">${f.proxima?R2(f.proxima.parcela):"—"}</td><td class="n">${R(f.saldo)}</td><td>${f.restantes?rotMes(f.fim):`<span class="chip good">Quitada</span>`}</td>
      <td style="white-space:nowrap"><button class="btn small" data-act="divSel" data-j="${j}">Cronograma</button><button class="icon-btn" data-act="delDiv" data-j="${j}" aria-label="Excluir">✕</button></td></tr>`;}).join("")}
    </tbody></table></div><p class="note" style="margin-bottom:0">“Entrada do dinheiro” é para empréstimos novos: o valor entra no fluxo de caixa naquele mês. Para dívidas que já existem, deixe em branco. Juros entram na DRE como despesa financeira; a amortização entra só no fluxo de caixa.</p>`:`<div class="empty">Nenhuma dívida cadastrada.</div>`,{acoes:`<button class="btn small primary" data-act="addDiv">+ Novo contrato</button>`})}
  ${X?`<div class="grid g2">
    ${panel(`Cronograma · ${esc(X.nome)}`,`<div class="tbl-wrap" style="box-shadow:none;max-height:380px;overflow:auto"><table><thead><tr><th>#</th><th>Mês</th><th class="n">Parcela</th><th class="n">Juros</th><th class="n">Amortização</th><th class="n">Saldo</th></tr></thead><tbody>
      ${crono.map((r,t)=>`<tr class="${r.ym===ym?"sub":""}"><td>${t+1}${r.carencia?' <span class="chip plain">carência</span>':""}</td><td>${rotMes(r.ym)}</td><td class="n">${R2(r.parcela)}</td><td class="n">${R2(r.juros)}</td><td class="n">${R2(r.amort)}</td><td class="n">${R2(r.saldo)}</td></tr>`).join("")}
      <tr class="tot"><td colspan="2">Total</td><td class="n">${R2(sum(crono.map(r=>r.parcela)))}</td><td class="n">${R2(sum(crono.map(r=>r.juros)))}</td><td class="n">${R2(sum(crono.map(r=>r.amort)))}</td><td></td></tr></tbody></table></div>`,{sub:`${X.sistema==="sac"?"SAC: amortização constante":"Price: parcelas iguais"} · ${XI.pagas} de ${XI.total} pagas até ${rotMes(ym)}`})}
    ${panel("Composição das parcelas",chart({labels:crono.map(r=>rotMes(r.ym)),bars:[{name:"Juros",color:"var(--s-out)",values:crono.map(r=>r.juros)},{name:"Amortização",color:"var(--s-in)",values:crono.map(r=>r.amort)}],stack:true,h:220})+`<h4 style="margin:16px 0 8px">Simular quitação antecipada</h4><div class="row" style="margin-bottom:10px"><div class="field"><label for="extra">Valor extra para amortizar em ${rotMes(ym)}</label><input id="extra" type="number" step="1000" data-ui="extra" value="${num(U.extra??10000)}"></div></div>${sim||'<p class="muted">Contrato já quitado no mês de análise.</p>'}`)}
  </div>`:""}`;
}
function I_comp(parc,P){const rb=P.rb[0];return rb?`${pct(parc/rb)} da receita do mês`:"";}

function telaMetas(){

    <div class="row c" style="justify-content:space-between"><span class="muted">${pct(x.progresso)} atingido · ${x.n} meses</span><span>Aporte necessário: <b>${R2(x.aporte)}</b>/mês</span></div></div>`;}).join("")||`<div class="empty">Nenhuma meta. Planeje uma reserva de emergência, a troca de um equipamento ou uma expansão.</div>`}</div>`,{acoes:`<button class="btn small primary" data-act="addMeta">+ Nova meta</button>`,sub:"Os aportes mensais podem entrar no fluxo de caixa (opção em Fluxo de caixa)"})}
  <div class="grid g2">
    ${panel("Simulador de investimento",`<div class="formgrid">
      <div class="field"><label for="si">Valor inicial</label><input id="si" type="number" step="1000" data-num data-bind="sim.inicial" value="${num(s.inicial)}"></div>
      <div class="field"><label for="sa">Aporte mensal</label><input id="sa" type="number" step="100" data-num data-bind="sim.aporte" value="${num(s.aporte)}"></div>
      <div class="field"><label for="st">Rendimento % a.a.</label><input id="st" type="number" step="0.1" data-num data-bind="sim.taxaAno" value="${num(s.taxaAno)}"></div>
      <div class="field"><label for="sn">Prazo (anos)</label><input id="sn" type="number" step="1" min="1" max="40" data-num data-bind="sim.anos" value="${num(s.anos)}"></div></div>
      <div class="kpis" style="margin-top:14px">${kpi("Valor final",R(saldo))}${kpi("Total aportado",R(aport))}${kpi("Rendimento",R(saldo-aport))}</div>`,{sub:"Juros compostos com aporte mensal fixo"})}
    ${panel("Evolução do patrimônio",chart({labels:am.map(p=>p.m%12===0?`ano ${p.m/12}`:`m${p.m}`),lines:[{name:"Saldo com rendimento",color:"var(--s-in)",values:am.map(p=>p.saldo),area:true},{name:"Total aportado",color:"var(--s-out)",values:am.map(p=>p.aport)}],h:250}))}
