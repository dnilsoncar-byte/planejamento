      const c=d.categorias[+t.dataset.cat],f=t.dataset.f;
      if(f==="nome")c.nome=t.value.trim()||"Sem nome";
      else if(f==="prazo")c.prazo=num(t.value);
      else{const m=+t.dataset.m;c[f][m]=f==="real"&&t.value.trim()===""?null:num(t.value);}
      mudou();return;
    }
    if(t.dataset.nome!==undefined){S.nome=t.value.trim()||"Sem nome";mudou();return;}
    if(t.dataset.emp&&t.id.startsWith("ed")){const patch={[t.dataset.emp]:t.value.trim()};if(patch.nome==="")return aviso("A empresa precisa de um nome.");await store.upd("empresas",S.empresa.id,patch);Object.assign(S.empresa,patch);lembra(S.empresa,ONLINE?S.user?.email:S.empresa.login);aviso("Empresa atualizada",true);rerender();return;}
    if(t.dataset.tf){U.tf[t.dataset.tf]=t.value;rerender();return;}
    if(t.dataset.bf){U.bf[t.dataset.bf]=t.value;rerender();return;}
    if(t.dataset.ui){U[t.dataset.ui]=t.value;rerender();return;}
    if(t.dataset.bind){
      let v=t.value;
      if(t.dataset.num!==undefined)v=num(v);
      if(t.dataset.bool!==undefined)v=v==="1";
      if((t.type==="month"||t.type==="date")&&!v&&t.dataset.empty===undefined)return;
      setPath(d,t.dataset.bind,v);mudou();
    }
  }catch(err){aviso(err.message||String(err));}
});
document.addEventListener("input",e=>{const t=e.target;if(t.type==="range"&&t.dataset.bind){const lb=document.querySelector(`label[for="${t.id}"]`);if(lb)lb.textContent=lb.textContent.replace(/[-+]?\d+%$/,(t.value>0?"+":"")+t.value+"%");}});

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,d=S.dados,id=b.dataset.id;
  try{switch(a){
    /* ---- navegação e acesso ---- */
    case "pag":S.pag=b.dataset.pag;lsSet("pf-pag",S.pag);render();window.scrollTo(0,0);break;
    case "sair":await sair();break;
    case "trocarEmpresa":await trocarEmpresa();break;
    case "cartao":{const c=S.cartoes.find(x=>x.id===id);
      if(ONLINE&&S.user&&c&&S.user.email.toLowerCase()===String(c.login).toLowerCase()){await abrirEmpresa(id);break;}
      S.acesso.abrir=S.acesso.abrir===id?null:id;S.acesso.erro="";render();setTimeout(()=>document.getElementById("lgSenha")?.focus(),0);break;}
    case "esquecer":esquece(id);await irAcesso();break;
    case "entrarConta":if(S.user){await mostrarPicker();break;}S.acesso.conta=true;render();setTimeout(()=>document.getElementById("cEmail")?.focus(),0);break;
    case "voltarCartoes":S.acesso.conta=false;render();break;
    case "abrirEmp":await abrirEmpresa(id);break;
    case "sairConta":await sb.auth.signOut();S.user=null;await irAcesso();break;
    case "novaEmpresa":S.modo="novaEmpresa";render();break;
    case "voltarAcesso":if(S.acesso.picker){S.modo="acesso";render();}else await irAcesso();break;

    /* ---- planejamento ---- */
    case "planModo":U.planModo=b.dataset.v;U.fill=null;render();break;
    case "addCat":{const c=novaCat(b.dataset.g,"Nova categoria");const pos=d.categorias.map(x=>x.grupo).lastIndexOf(b.dataset.g);d.categorias.splice(pos<0?d.categorias.length:pos+1,0,c);mudou();setTimeout(()=>{const el=document.getElementById("cn_"+c.id);el?.focus();el?.select();},30);break;}
    case "fill":U.fill=id||null;render();break;
    case "fillAplica":{const c=d.categorias[+b.dataset.i],base=num(val("fBase")),g=num(val("fCresc"))/100,de=+val("fDe"),saz=document.getElementById("fSaz").checked,ms=mesesDo(d);
      for(let k=de;k<H;k++){let v=base*Math.pow(1+g,k-de);if(saz)v*=1+num(d.sazonal[+ms[k].split("-")[1]-1])/100;c.prev[k]=Math.round(v*100)/100;}U.fill=null;mudou();break;}
    case "fillReal":{const c=d.categorias[+b.dataset.i],kk=idxMes(d,d.mesRef);for(let k=0;k<=Math.min(kk,H-1);k++)if(c.real[k]==null)c.real[k]=c.prev[k];U.fill=null;mudou();break;}
    case "fillZera":{const c=d.categorias[+b.dataset.i];c[U.planModo==="real"?"real":"prev"]=U.planModo==="real"?Array(H).fill(null):zeros();U.fill=null;mudou();break;}
    case "delCat":d.categorias.splice(+b.dataset.i,1);U.fill=null;mudou();break;
    case "rolar":{for(const c of d.categorias){c.prev=[...c.prev.slice(1),c.prev[H-1]];c.real=[...c.real.slice(1),null];}d.inicio=addMes(d.inicio,1);if(idxMes(d,d.mesRef)<0)d.mesRef=d.inicio;mudou();aviso(`Horizonte agora começa em ${rotMes(d.inicio)}`,true);break;}
    case "copiarDRE":{const ms=mesesDo(d),campo=U.planModo==="real"?"real":"prev";const linhas=[["Grupo","Categoria",...ms.map(rotMes),"Total"]];
      for(const g of GRUPOS)for(const c of d.categorias.filter(x=>x.grupo===g.k))linhas.push([g.nome,c.nome,...c[campo].map(v=>csvNum(num(v))),csvNum(sum(c[campo].map(num)))]);
      await copiar(linhas.map(l=>l.join("\t")).join("\n"),"copMsg");break;}

    /* ---- fluxo ---- */
    case "usarSaldoBanco":d.saldoInicial=Math.round(saldoAte("",d.inicio+"-01")*100)/100;mudou();break;
    case "zeraSens":d.sens={rec:0,desp:0};mudou();break;
    case "copiarFluxo":{const P=projeta(d);await copiar([["Linha",...P.ms.map(rotMes)].join("\t"),...linhasFluxo(P).map(([n,arr])=>[n,...arr.map(csvNum)].join("\t"))].join("\n"),"copMsg");break;}

    /* ---- títulos ---- */
    case "salvaTitulo":{const err=document.getElementById("tErr");const t={tipo:val("tTipo"),descricao:val("tDesc"),contraparte:val("tCont"),categoria:val("tCat")||null,documento:val("tDoc"),valor:num(val("tValor")),vencimento:val("tVenc")};
      if(!t.descricao){err.textContent="Informe a descrição.";break;}if(!(t.valor>0)){err.textContent="Informe um valor maior que zero.";break;}if(!t.vencimento){err.textContent="Informe o vencimento.";break;}
      err.textContent="Gravando…";U.tTipo=t.tipo;
      if(U.tEdit){await store.upd("titulos",U.tEdit,t);Object.assign(S.titulos.find(x=>x.id===U.tEdit),t);U.tEdit=null;}
      else{const n=Math.max(1,Math.min(120,Math.round(num(val("tParc"))||1))),total=val("tModo")==="total";const vp=total?Math.floor(t.valor/n*100)/100:t.valor;
        const rows=[...Array(n)].map((_,i)=>({...t,empresa_id:S.empresa.id,descricao:n>1?`${t.descricao} (${i+1}/${n})`:t.descricao,vencimento:addMesData(t.vencimento,i),valor:total&&i===n-1?Math.round((t.valor-vp*(n-1))*100)/100:vp}));
        S.titulos.push(...await store.ins("titulos",rows));}
      aviso("Título gravado",true);render();setTimeout(()=>document.getElementById("tDesc")?.focus(),0);break;}
    case "cancelaTitulo":U.tEdit=null;render();break;
    case "editTitulo":U.tEdit=id;render();document.getElementById("formTitulo")?.scrollIntoView({behavior:"smooth",block:"center"});break;
    case "delTitulo":if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Excluir?";b.style.color="var(--bad)";b.style.fontSize=".74rem";break;}
      {const t=S.titulos.find(x=>x.id===id);if(t?.movimento_id){await store.del("movs",t.movimento_id).catch(()=>{});S.movs=S.movs.filter(m=>m.id!==t.movimento_id);}
      await store.del("titulos",id);S.titulos=S.titulos.filter(x=>x.id!==id);render();break;}
    case "baixa":U.baixa=id||null;render();break;
    case "baixaOk":{const t=S.titulos.find(x=>x.id===id),data=val("bxData"),conta=val("bxConta"),v=num(val("bxValor"));if(!data||!(v>0)){aviso("Informe a data e o valor.");break;}
      let movId=null;
      if(conta){const[m]=await store.ins("movs",{empresa_id:S.empresa.id,conta_id:conta,conta_destino_id:null,data,tipo:t.tipo==="receber"?"entrada":"saida",descricao:`${t.tipo==="receber"?"Recebimento":"Pagamento"}: ${t.descricao}${t.contraparte?" · "+t.contraparte:""}`,categoria:t.categoria||null,valor:v});S.movs.push(m);movId=m.id;}
      const patch={pago_em:data,valor_pago:v,conta_id:conta||null,movimento_id:movId};await store.upd("titulos",id,patch);Object.assign(t,patch);U.baixa=null;aviso(t.tipo==="receber"?"Recebimento registrado":"Pagamento registrado",true);render();break;}
    case "estorna":{const t=S.titulos.find(x=>x.id===id);if(t.movimento_id){await store.del("movs",t.movimento_id).catch(()=>{});S.movs=S.movs.filter(m=>m.id!==t.movimento_id);}
      const patch={pago_em:null,valor_pago:null,conta_id:null,movimento_id:null};await store.upd("titulos",id,patch);Object.assign(t,patch);aviso("Baixa estornada",true);render();break;}
    case "limpaTf":U.tf={tipo:"",status:"abertos",mes:"",busca:""};render();break;

    /* ---- bancos ---- */
    case "novaConta":U.contaEdit="nova";U.delConta=false;render();window.scrollTo(0,0);break;
    case "editConta":U.contaEdit=id;U.delConta=false;render();window.scrollTo(0,0);break;
    case "cancelaConta":U.contaEdit=null;render();break;
    case "salvaConta":{const c={nome:val("ctNome"),banco:val("ctBanco"),agencia:val("ctAg"),numero:val("ctNum"),tipo:val("ctTipo"),saldo_inicial:num(val("ctSaldo")),data_saldo:val("ctData")||null};
      if(!c.nome){aviso("Informe o nome da conta.");break;}
      if(U.contaEdit&&U.contaEdit!=="nova"){await store.upd("contas",U.contaEdit,c);Object.assign(S.contas.find(x=>x.id===U.contaEdit),c);}
      else{const[x]=await store.ins("contas",{...c,empresa_id:S.empresa.id});S.contas.push(x);}
      U.contaEdit=null;aviso("Conta salva",true);render();break;}
    case "delConta":U.delConta=true;render();break;
    case "delContaOk":{const cid=U.contaEdit;await store.del("contas",cid);S.contas=S.contas.filter(c=>c.id!==cid);S.movs=S.movs.filter(m=>m.conta_id!==cid&&m.conta_destino_id!==cid);if(U.bf?.conta===cid)U.bf.conta="";U.contaEdit=null;U.delConta=false;render();break;}
    case "filtraConta":U.bf.conta=id;render();break;
    case "salvaMov":{const err=document.getElementById("mvErr");const m={data:val("mvData"),tipo:val("mvTipo"),conta_id:val("mvConta"),descricao:val("mvDesc"),valor:num(val("mvValor"))};
      m.conta_destino_id=m.tipo==="transferencia"?val("mvDest"):null;m.categoria=m.tipo==="transferencia"?null:(val("mvCat")||null);
      if(!m.data){err.textContent="Informe a data.";break;}if(!(m.valor>0)){err.textContent="Informe um valor maior que zero.";break;}
      if(m.tipo==="transferencia"&&m.conta_destino_id===m.conta_id){err.textContent="Escolha contas de origem e destino diferentes.";break;}
      err.textContent="Gravando…";
      if(U.movEdit){await store.upd("movs",U.movEdit,m);Object.assign(S.movs.find(x=>x.id===U.movEdit),m);U.movEdit=null;}
      else{const[x]=await store.ins("movs",{...m,empresa_id:S.empresa.id});S.movs.push(x);}
      U.bf.mes=m.data.slice(0,7);aviso("Lançamento gravado",true);render();setTimeout(()=>document.getElementById("mvValor")?.focus(),0);break;}
    case "editMov":U.movEdit=id;render();document.getElementById("formMov")?.scrollIntoView({behavior:"smooth",block:"center"});break;
    case "cancelaMov":U.movEdit=null;render();break;
    case "delMov":if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Excluir?";b.style.color="var(--bad)";b.style.fontSize=".74rem";break;}
      await store.del("movs",id);S.movs=S.movs.filter(m=>m.id!==id);for(const t of S.titulos)if(t.movimento_id===id){const p={pago_em:null,valor_pago:null,conta_id:null,movimento_id:null};await store.upd("titulos",t.id,p);Object.assign(t,p);}
      if(U.movEdit===id)U.movEdit=null;render();break;
    case "realPede":U.confReal=true;render();break;
    case "realNao":U.confReal=false;render();break;
    case "realOk":{const k=idxMes(d,d.mesRef),tot={};for(const m of S.movs)if(m.data.slice(0,7)===d.mesRef&&m.tipo!=="transferencia"&&m.categoria){const key=m.categoria.trim().toLowerCase();tot[key]=tot[key]||{e:0,s:0};tot[key][m.tipo==="entrada"?"e":"s"]+=num(m.valor);}
      let n=0;for(const c of d.categorias){const t=tot[c.nome.trim().toLowerCase()];if(t){c.real[k]=Math.round((G[c.grupo].sinal>0?t.e-t.s:t.s-t.e)*100)/100;n++;}}
      U.confReal=false;agendarSalvar();render();const el=document.getElementById("realMsg");if(el)el.textContent=n?`${n} categoria(s) atualizada(s).`:"Nenhuma categoria do planejamento tem o mesmo nome.";break;}

    /* ---- investimentos ---- */
    case "addProj":{const p={id:uid(),nome:"Novo projeto",investimento:100000,tma:12,periodo:"ano",fluxos:[30000,30000,30000,30000,30000],residual:0};d.projetos.push(p);U.proj=p.id;mudou();break;}
    case "selProj":U.proj=id;render();break;
    case "gerarFluxos":{const p=d.projetos[+b.dataset.i],v=num(val("gVal")),n=Math.max(1,Math.min(120,Math.round(num(val("gN"))))),g=num(val("gCr"))/100;p.fluxos=[...Array(n)].map((_,t)=>Math.round(v*Math.pow(1+g,t)*100)/100);mudou();break;}
    case "addFluxo":{const p=d.projetos[+b.dataset.i];p.fluxos=p.fluxos||[];p.fluxos.push(p.fluxos.length?p.fluxos[p.fluxos.length-1]:0);mudou();break;}
    case "delFluxo":d.projetos[+b.dataset.i].fluxos.splice(+b.dataset.t,1);mudou();break;
    case "dupProj":{const p=JSON.parse(JSON.stringify(d.projetos[+b.dataset.i]));p.id=uid();p.nome+=" (cópia)";d.projetos.push(p);U.proj=p.id;mudou();break;}
    case "delProj":U.delProj=id;render();break;
    case "delProjOk":d.projetos.splice(+b.dataset.i,1);U.delProj=null;U.proj=null;mudou();break;

    /* ---- dívidas e metas ---- */
    case "addDiv":d.dividas.push({id:uid(),nome:"Novo contrato",valor:50000,taxa:1.5,parcelas:24,carencia:0,sistema:"price",inicio:addMes(d.inicio,1),captacao:d.inicio});U.divSel=d.dividas.length-1;mudou();break;
    case "delDiv":if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Excluir?";b.style.color="var(--bad)";b.style.fontSize=".74rem";break;}d.dividas.splice(+b.dataset.j,1);U.divSel=0;mudou();break;
    case "divSel":U.divSel=+b.dataset.j;render();break;
    case "addMeta":d.metas.push({id:uid(),nome:"Nova meta",alvo:50000,atual:0,prazo:addMes(d.inicio,12),taxaAno:10});mudou();break;
    case "delMeta":d.metas.splice(+b.dataset.i,1);mudou();break;

    /* ---- empresa, cenários e acessos ---- */
    case "addUsuario":{const em=val("nuEmail").toLowerCase(),err=document.getElementById("nuErr");if(!/^\S+@\S+\.\S+$/.test(em)){err.textContent="Informe um e-mail válido.";break;}
      if(S.usuarios.some(u=>u.email.toLowerCase()===em)){err.textContent="Este e-mail já tem acesso.";break;}
      await store.ins("usuarios",{empresa_id:S.empresa.id,email:em,papel:val("nuPapel")});S.usuarios=await store.list("usuarios",S.empresa.id);aviso("Acesso liberado",true);render();break;}
    case "delUsuario":await store.del("usuarios",id);S.usuarios=S.usuarios.filter(u=>u.id!==id);render();break;
    case "trocaSenha":{const err=document.getElementById("lsErr"),e2=S.empresa,login=val("lsLogin");
      if(!login){err.textContent="Informe o login.";break;}
      if(await sha256(e2.id+":"+document.getElementById("lsAtual").value)!==e2.senha_hash){err.textContent="Senha atual incorreta.";break;}
      const nova=document.getElementById("lsNova").value;const patch={login};
      if(nova){if(nova.length<4){err.textContent="A nova senha precisa de pelo menos 4 caracteres.";break;}if(nova!==document.getElementById("lsNova2").value){err.textContent="As senhas não conferem.";break;}patch.senha_hash=await sha256(e2.id+":"+nova);}
      await store.upd("empresas",e2.id,patch);Object.assign(e2,patch);lembra(e2,login);aviso("Login e senha atualizados",true);render();break;}
    case "dupPlano":{if(saveTimer){clearTimeout(saveTimer);await salvar();}const[p]=await store.ins("planos",{empresa_id:S.empresa.id,nome:S.nome+" (cópia)",dados:JSON.parse(JSON.stringify(d))});S.planos=await store.listPlanos(S.empresa.id);U.compara=null;await abrirPlano(p.id);break;}
    case "novoPlano":{const[p]=await store.ins("planos",{empresa_id:S.empresa.id,nome:"Novo cenário",dados:basico()});S.planos=await store.listPlanos(S.empresa.id);U.compara=null;await abrirPlano(p.id);break;}
    case "delPlano":if(S.planos.length<=1){aviso("A empresa precisa ter pelo menos um cenário.");break;}U.delPlano=true;render();break;
    case "delPlanoNao":U.delPlano=false;render();break;
    case "delPlanoOk":await store.del("planos",S.atualId);S.planos=S.planos.filter(p=>p.id!==S.atualId);U.delPlano=false;U.compara=null;await abrirPlano(S.planos[0].id);break;
    case "comparar":{if(saveTimer){clearTimeout(saveTimer);await salvar();}const out=[];for(const p of S.planos){const full=await store.getPlano(p.id),dd=migra(full.dados),I=indicadores(dd);out.push({id:p.id,nome:p.nome,I,SA:saude(dd,I)});}U.compara=out;render();break;}
    case "abrePlano":await abrirPlano(id);break;
    case "delEmp":U.delEmp=true;render();break;
    case "delEmpNao":U.delEmp=false;render();break;
    case "delEmpOk":{const eid=S.empresa.id;await store.del("empresas",eid);esquece(eid);ssSet("pf-empresa",null);await irAcesso("Empresa excluída.");break;}
  }}catch(err){console.error(err);aviso(err.message||String(err));if(S.modo==="acesso"){S.acesso.erro=err.message;render();}}
});

document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="fCartao"){const err=document.getElementById("lgErr");err.textContent="Entrando…";
    try{await entrarCartao(f.dataset.id,val("lgLogin"),document.getElementById("lgSenha").value);}catch(x){if(S.modo!=="acesso"){S.modo="acesso";S.acesso.abrir=f.dataset.id;}render();const el=document.getElementById("lgErr");if(el)el.textContent=x.message;}}
  if(f.id==="fConta"){try{S.acesso.erro="";await entrarConta(val("cEmail"),document.getElementById("cSenha").value);}catch(x){S.acesso.erro=x.message;render();}}
  if(f.id==="fEmpresa"){const err=document.getElementById("neErr");
    const g=k=>val("ne"+k);const dados={nome:g("Nome"),cnpj:g("Cnpj"),setor:g("Setor"),regime:g("Regime"),cidade:g("Cidade"),responsavel:g("Resp"),contato:g("Contato"),basico:document.getElementById("neBasico").checked};
    if(!dados.nome){err.textContent="Informe o nome da empresa.";return;}
    if(!ONLINE){dados.login=g("Login");dados.senha=document.getElementById("neSenha").value;
      if(!dados.login){err.textContent="Defina um login de acesso.";return;}
      if(dados.senha.length<4){err.textContent="A senha precisa de pelo menos 4 caracteres.";return;}
      if(dados.senha!==document.getElementById("neSenha2").value){err.textContent="As senhas não conferem.";return;}}
    try{err.textContent="Cadastrando…";await criarEmpresa(dados);}catch(x){err.textContent=x.message;}}
});
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const el=e.target.closest?.("[data-tip]");if(!el){tip.hidden=true;return;}tip.innerHTML=el.dataset.tip;tip.hidden=false;
  tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY+14+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+14)+"px";});
window.addEventListener("beforeunload",e=>{if(saveTimer){salvar();e.preventDefault();e.returnValue="";}});
if(ONLINE)sb.auth.onAuthStateChange((ev,session)=>{if(ev==="SIGNED_OUT"&&S.modo==="app"){S.user=null;irAcesso("Sua sessão terminou. Entre novamente.");}});
boot();
</script>
